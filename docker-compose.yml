name: market-footfall-correlation
services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-market-footfall-correlation}-db
    environment:
      MYSQL_DATABASE: market_analytics
      MYSQL_USER: app
      MYSQL_PASSWORD: ${DB_PASSWORD:-MarketDemo2026!}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-MarketDemo2026!}
    ports: ["${DB_PORT:-17741}:3306"]
    command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: ["market-footfall-db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -e \"SELECT 1\" >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-market-footfall-correlation}-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["market-footfall-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-market-footfall-correlation}-backend
    environment: &app-env
      DATABASE_URL: mysql+pymysql://app:${DB_PASSWORD:-MarketDemo2026!}@db:3306/market_analytics
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-market-footfall-correlation-local-secret}
      SEED_DEMO: ${SEED_DEMO:-true}
      ARTIFACT_DIR: /artifacts
    ports: ["${BACKEND_PORT:-19241}:8000"]
    volumes: ["market-footfall-artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 4s
      timeout: 3s
      retries: 35
      start_period: 15s
  worker:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-market-footfall-correlation}-worker
    command: ["python", "-m", "src.worker"]
    environment: *app-env
    volumes: ["market-footfall-artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.path.getmtime('/tmp/heartbeat')<30"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-market-footfall-correlation}-frontend
    ports: ["${FRONTEND_PORT:-18241}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 4s
      timeout: 3s
      retries: 20
volumes:
  market-footfall-db:
  market-footfall-redis:
  market-footfall-artifacts:
